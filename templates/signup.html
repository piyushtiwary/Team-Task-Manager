{% extends "base.html" %}

{% block title %}Sign Up - ProjectManager{% endblock %}

{% block content %}
<div class="form-center">
    <h2>Create Account</h2>
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required placeholder="Enter your name">
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter a password (min 6 characters)">
        </div>
        
        <div class="form-group">
            <label for="password2">Confirm Password</label>
            <input type="password" id="password2" name="password2" required placeholder="Confirm your password">
        </div>
        
        <button type="submit" style="width: 100%;">Sign Up</button>
        
        <div class="form-link">
            Already have an account? <a href="{% url 'login' %}">Login here</a>
        </div>
    </form>
</div>
{% endblock %}
