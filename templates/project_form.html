{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="form-center">
    <h1>{{ project.name|default:"Create New Project" }}</h1>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" class="form-group">
        {% csrf_token %}
        
        <div>
            <label for="name">Project Name *</label>
            <input 
                type="text" 
                id="name" 
                name="name" 
                value="{{ project.name|default:'' }}" 
                required
                placeholder="Enter project name"
            >
        </div>

        <div>
            <label for="description">Description</label>
            <textarea 
                id="description" 
                name="description"
                placeholder="Enter project description"
                rows="5"
            >{{ project.description|default:'' }}</textarea>
        </div>

        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn">
                {% if project %}Update Project{% else %}Create Project{% endif %}
            </button>
            <a href="{% url 'projects' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<style>
    .alert {
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 4px;
    }
    
    .alert-error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
    
    .alert-success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    
    textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-family: Arial, sans-serif;
        resize: vertical;
    }
    
    .btn-secondary {
        background-color: #6c757d;
        color: white;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 4px;
        display: inline-block;
        border: none;
        cursor: pointer;
    }
    
    .btn-secondary:hover {
        background-color: #5a6268;
    }
</style>
{% endblock %}
